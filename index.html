<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cytron Tutorial Page — Current vs Redesign</title>
<style>
  :root{--ink:#10233a;--ink-2:#48596b;--line:#dce4ea;--cyan:#0da9dd;--orange:#ff5516;--paper:#f5f8fa}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:14px}
  .bar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:5}
  .bar h1{font-size:15px;margin:0;font-weight:600}
  .bar h1 small{color:var(--ink-2);font-weight:400;margin-left:8px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;background:#fff;padding:7px 12px;cursor:pointer;font:inherit;color:var(--ink-2)}
  .seg button.on{background:var(--ink);color:#fff}
  .bar .sp{flex:1}
  .bar a{color:var(--cyan);font-weight:500}
  .bar select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .bar label{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
  .frames{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px;align-items:start}
  .frames.single{grid-template-columns:1fr}
  .pane{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .pane header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
  .pane header b{color:var(--ink);font-weight:600}
  .pane header b.a{color:var(--cyan)}.pane header b.b{color:var(--orange)}.pane header b.c{color:#1f9d55}
  .pane header a{color:var(--cyan)}
  .viewport{display:flex;justify-content:center;background:#e9eef2}
  iframe{border:0;width:100%;height:calc(100vh - 120px);background:#fff;display:block;transition:width .2s}
  .viewport.mobile iframe{width:390px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .viewport.tablet iframe{width:820px}
  @media (max-width:900px){.frames{grid-template-columns:1fr}iframe{height:70vh}}
</style>
</head>
<body>
<div class="bar">
  <h1>Cytron Tutorial Page <small>current site mirrored beside the redesign</small></h1>
  <label>Left <select id="left"><option value="current">Current (mirror)</option><option value="new-c">Redesign (Option C)</option></select></label>
  <label>Right <select id="right"><option value="current">Current (mirror)</option><option value="new-c" selected>Redesign (Option C)</option><option value="">— none (single) —</option></select></label>
  <div class="seg" id="vp"><button data-w="desktop" class="on">Desktop</button><button data-w="tablet">Tablet</button><button data-w="mobile">Phone</button></div>
  <select id="page">
    <option value="home">Listing / home</option>
    <option value="search">Search: “esp32”</option>
    <option value="art1">Article: ESP32 Smart Home Dashboard</option>
    <option value="art2">Article: MDDRC5 success story</option>
    <option value="art3">Article: Jetson Orin NX (Advanced)</option>
    <option value="cat13">Category: Wireless &amp; IoT</option>
    <option value="cat4">Category: micro:bit</option>
  </select>
  <span class="sp"></span>
  <a href="docs/tutorial-page-audit.md">Audit</a>
  <a href="docs/redesign-notes.md">Redesign notes</a>
</div>
<div class="frames" id="frames">
  <div class="pane" id="paneL"><header><span id="labL"></span><a id="openL" target="_blank">Open ↗</a></header><div class="viewport" id="vpL"><iframe id="fL" title="Left"></iframe></div></div>
  <div class="pane" id="paneR"><header><span id="labR"></span><a id="openR" target="_blank">Open ↗</a></header><div class="viewport" id="vpR"><iframe id="fR" title="Right"></iframe></div></div>
</div>
<script>
  const $=s=>document.querySelector(s);
  const LABEL={current:'<b>Current</b> — mirror of my.cytron.io/tutorial','new-c':'<b class="c">Redesign</b> — board chips, featured + latest, instant filter bar, one row per platform'};
  const PAGES={
    home:{current:'index.html','new-c':'index.html'},
    search:{current:'index.html?q=esp32','new-c':'index.html?q=esp32'},
    art1:{all:'tutorial.html?slug=esp32-smart-home-dashboard-with-real-time-sensor-data'},
    art2:{all:'tutorial.html?slug=mddrc5-500g-rc-sumo-rovation-2026'},
    art3:{all:'tutorial.html?slug=ai-animal-sound-detection-using-jetson-orin-nx'},
    cat13:{current:'index.html?categories=13','new-c':'category.html?id=13'},
    cat4:{current:'index.html?categories=4','new-c':'category.html?id=4'}
  };
  function url(v,p){const m=PAGES[p];return v+'/'+(m.all||m[v]);}
  function render(){
    const l=$('#left').value,r=$('#right').value,p=$('#page').value;
    $('#fL').src=url(l,p);$('#openL').href=url(l,p);$('#labL').innerHTML=LABEL[l];
    $('#paneR').style.display=r?'':'none';$('#frames').classList.toggle('single',!r);
    if(r){$('#fR').src=url(r,p);$('#openR').href=url(r,p);$('#labR').innerHTML=LABEL[r];}
  }
  ['#left','#right','#page'].forEach(s=>$(s).addEventListener('change',render));
  $('#vp').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;[...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));['vpL','vpR'].forEach(id=>{document.getElementById(id).className='viewport '+(b.dataset.w==='desktop'?'':b.dataset.w);});});
  render();
</script>
</body>
</html>
