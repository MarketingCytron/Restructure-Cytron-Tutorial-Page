<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cytron Tutorial Page — Current vs New</title>
<style>
  :root{--ink:#10233a;--ink-2:#48596b;--line:#dce4ea;--cyan:#0da9dd;--orange:#ff5516;--paper:#f5f8fa}
  *{box-sizing:border-box}
  body{margin:0;font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:14px}
  .bar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:5}
  .bar h1{font-size:15px;margin:0;font-weight:600}
  .bar h1 small{color:var(--ink-2);font-weight:400;margin-left:8px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;background:#fff;padding:7px 12px;cursor:pointer;font:inherit;color:var(--ink-2)}
  .seg button.on{background:var(--ink);color:#fff}
  .bar .sp{flex:1}
  .bar a{color:var(--cyan);font-weight:500}
  .bar select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .frames{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px;align-items:start}
  .frames.single{grid-template-columns:1fr}
  .pane{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .pane header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
  .pane header b{color:var(--ink);font-weight:600}
  .pane header b.new{color:var(--orange)}
  .pane header a{color:var(--cyan)}
  .viewport{display:flex;justify-content:center;background:#e9eef2;padding:0}
  iframe{border:0;width:100%;height:calc(100vh - 120px);background:#fff;display:block;transition:width .2s}
  .viewport.mobile iframe{width:390px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .viewport.tablet iframe{width:820px}
  @media (max-width:900px){.frames{grid-template-columns:1fr}iframe{height:70vh}}
</style>
</head>
<body>
<div class="bar">
  <h1>Cytron Tutorial Page <small>prototype — current site mirrored beside the proposed redesign</small></h1>
  <div class="seg" id="view"><button data-v="both" class="on">Side by side</button><button data-v="current">Current only</button><button data-v="new">New only</button></div>
  <div class="seg" id="vp"><button data-w="desktop" class="on">Desktop</button><button data-w="tablet">Tablet</button><button data-w="mobile">Phone</button></div>
  <select id="page">
    <option value="index.html">Listing / home</option>
    <option value="index.html?q=esp32">Search: “esp32”</option>
    <option value="tutorial.html?slug=esp32-smart-home-dashboard-with-real-time-sensor-data">Article: ESP32 Smart Home Dashboard</option>
    <option value="tutorial.html?slug=mddrc5-500g-rc-sumo-rovation-2026">Article: MDDRC5 success story</option>
    <option value="tutorial.html?slug=ai-animal-sound-detection-using-jetson-orin-nx">Article: Jetson Orin NX (Advanced)</option>
    <option value="category.html?id=13">Category page: Wireless &amp; IoT (new only)</option>
    <option value="category.html?id=4">Category page: micro:bit (new only)</option>
  </select>
  <span class="sp"></span>
  <a href="docs/tutorial-page-audit.md">Audit</a>
  <a href="docs/redesign-notes.md">Redesign notes</a>
</div>
<div class="frames" id="frames">
  <div class="pane" id="paneCur"><header><span><b>Current</b> — mirror of my.cytron.io/tutorial</span><a id="openCur" href="current/index.html" target="_blank">Open ↗</a></header><div class="viewport" id="vpCur"><iframe id="fCur" src="current/index.html" title="Current site mirror"></iframe></div></div>
  <div class="pane" id="paneNew"><header><span><b class="new">New</b> — proposed redesign</span><a id="openNew" href="new/index.html" target="_blank">Open ↗</a></header><div class="viewport" id="vpNew"><iframe id="fNew" src="new/index.html" title="Redesign"></iframe></div></div>
</div>
<script>
  const $=s=>document.querySelector(s);
  function setPage(){
    const p=$('#page').value;
    $('#fCur').src='current/'+(p.startsWith('category')?'index.html?categories='+new URLSearchParams(p.split('?')[1]).get('id'):p);
    $('#fNew').src='new/'+p;
    $('#openCur').href=$('#fCur').src; $('#openNew').href=$('#fNew').src;
  }
  $('#page').addEventListener('change',setPage);
  $('#view').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;[...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));const v=b.dataset.v;$('#paneCur').style.display=v==='new'?'none':'';$('#paneNew').style.display=v==='current'?'none':'';$('#frames').classList.toggle('single',v!=='both');});
  $('#vp').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;[...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));['vpCur','vpNew'].forEach(id=>{const el=document.getElementById(id);el.className='viewport '+(b.dataset.w==='desktop'?'':b.dataset.w);});});
</script>
</body>
</html>
